name: Backend CI/CD (Render)

on:
  push:
    branches:
      - main
      - latest
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-render.yml'
  pull_request:
    branches:
      - main
      - latest
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-render.yml'
  workflow_dispatch:

jobs:
  ci-backend:
    name: Backend CI (Test & Validate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: |
          npm ci || npm install

      - name: Validate syntax and run tests
        working-directory: backend
        run: |
          npm test

  cd-render:
    name: Backend CD (Deploy to Render)
    needs: ci-backend
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && success()
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret 'RENDER_DEPLOY_HOOK_URL' is not defined!"
            echo "To configure:"
            echo "1. Go to your Render Dashboard -> Your Web Service -> Settings."
            echo "2. Copy the 'Deploy Hook' URL."
            echo "3. Go to GitHub Repo -> Settings -> Secrets and variables -> Actions."
            echo "4. Add secret 'RENDER_DEPLOY_HOOK_URL'."
            exit 1
          fi

          echo "🚀 Triggering Render deployment via webhook..."
          HTTP_RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")

          echo "HTTP Status: $HTTP_RESPONSE"
          cat response.txt
          echo ""

          if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
            echo "✅ Successfully dispatched deployment to Render!"
          else
            echo "::error::Render deploy hook failed with status code: $HTTP_RESPONSE"
            exit 1
          fi
